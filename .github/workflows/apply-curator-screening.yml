name: Apply curator screening integration

on:
  push:
    branches: [build/curator-screening]
    paths:
      - ".github/workflows/apply-curator-screening.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/curator-screening

      - name: Patch curator and Pillow compatibility
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("curate.js")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '  status: "undecided",\n  sort: "priority",',
                  '  status: "undecided",\n  screening: "all",\n  sort: "priority",',
              ),
              (
                  '  difficultyScore: document.querySelector("#difficultyScore"),\n  qualityFlags: document.querySelector("#qualityFlags"),',
                  '  difficultyScore: document.querySelector("#difficultyScore"),\n  qualityFlags: document.querySelector("#qualityFlags"),\n  screeningRisk: document.querySelector("#screeningRisk"),\n  screeningStatus: document.querySelector("#screeningStatus"),\n  screeningFlags: document.querySelector("#screeningFlags"),',
              ),
              (
                  '  statusSelect: document.querySelector("#statusSelect"),\n  sortSelect: document.querySelector("#sortSelect"),',
                  '  statusSelect: document.querySelector("#statusSelect"),\n  screeningSelect: document.querySelector("#screeningSelect"),\n  sortSelect: document.querySelector("#sortSelect"),',
              ),
              (
                  '  remainingStat: document.querySelector("#remainingStat"),\n  exportButton: document.querySelector("#exportButton"),',
                  '  remainingStat: document.querySelector("#remainingStat"),\n  flaggedStat: document.querySelector("#flaggedStat"),\n  exportButton: document.querySelector("#exportButton"),',
              ),
              (
                  '''function compareRounds(left, right) {\n  if (state.sort === "priority") {''',
                  '''function compareRounds(left, right) {\n  if (state.sort === "screening") {\n    const leftValue = CuratorScreening.riskScore(left) ?? -1;\n    const rightValue = CuratorScreening.riskScore(right) ?? -1;\n    if (rightValue !== leftValue) return rightValue - leftValue;\n  } else if (state.sort === "priority") {''',
              ),
              (
                  '''  state.filtered = state.rounds.filter((round) => {\n    const categoryMatch = state.category === "all" || categoryKey(round) === state.category;\n    return categoryMatch && matchesStatus(round);\n  });''',
                  '''  state.filtered = state.rounds.filter((round) => {\n    const categoryMatch = state.category === "all" || categoryKey(round) === state.category;\n    const screeningMatch = CuratorScreening.matches(round, state.screening);\n    return categoryMatch && matchesStatus(round) && screeningMatch;\n  });''',
              ),
              (
                  '''  els.remainingStat.textContent = Math.max(0, state.rounds.length - reviewed).toLocaleString();\n}''',
                  '''  els.remainingStat.textContent = Math.max(0, state.rounds.length - reviewed).toLocaleString();\n  const flagged = state.rounds.filter((round) => CuratorScreening.needsReview(round)).length;\n  els.flaggedStat.textContent = flagged.toLocaleString();\n}''',
              ),
              (
                  '''function renderAnalysis(round) {''',
                  '''function renderScreening(round) {\n  const screening = CuratorScreening.screening(round);\n  const risk = CuratorScreening.riskScore(round);\n  els.screeningRisk.textContent = risk === null ? "Not screened" : `${risk}/100`;\n  els.screeningStatus.textContent = CuratorScreening.statusLabel(round);\n\n  if (!screening) {\n    const item = document.createElement("li");\n    item.textContent = "Run scripts/screen_dataset.py to add screening signals";\n    item.className = "screening-note";\n    els.screeningFlags.replaceChildren(item);\n    return;\n  }\n\n  const flags = CuratorScreening.sortedFlags(round);\n  if (!flags.length) {\n    const item = document.createElement("li");\n    item.textContent = "No screening flags";\n    item.className = "screening-clear";\n    els.screeningFlags.replaceChildren(item);\n    return;\n  }\n\n  els.screeningFlags.replaceChildren(...flags.map((flag) => {\n    const item = document.createElement("li");\n    const source = cleanText(flag.source);\n    item.textContent = source\n      ? `${humanizeFlag(flag.name)} · ${source.replaceAll("_", " ")}`\n      : humanizeFlag(flag.name);\n    const severity = ["low", "medium", "high"].includes(flag.severity) ? flag.severity : "low";\n    item.className = `screening-${severity}`;\n    return item;\n  }));\n}\n\nfunction renderAnalysis(round) {''',
              ),
              (
                  '  renderDecision(round);\n  renderAnalysis(round);',
                  '  renderDecision(round);\n  renderScreening(round);\n  renderAnalysis(round);',
              ),
              (
                  '''  els.statusSelect.addEventListener("change", () => {\n    state.status = els.statusSelect.value;\n    state.index = 0;\n    rebuildFilter();\n  });\n  els.sortSelect.addEventListener("change", () => {''',
                  '''  els.statusSelect.addEventListener("change", () => {\n    state.status = els.statusSelect.value;\n    state.index = 0;\n    rebuildFilter();\n  });\n  els.screeningSelect.addEventListener("change", () => {\n    state.screening = els.screeningSelect.value;\n    state.index = 0;\n    rebuildFilter();\n  });\n  els.sortSelect.addEventListener("change", () => {''',
              ),
              (
                  '''    const scored = state.rounds.filter((round) => round.analysis && typeof round.analysis === "object").length;\n    els.datasetNote.textContent = `${payload.name || source} · ${state.rounds.length.toLocaleString()} rounds · ${scored.toLocaleString()} scored · signature ${state.datasetSignature}`;''',
                  '''    const scored = state.rounds.filter((round) => round.analysis && typeof round.analysis === "object").length;\n    const screened = state.rounds.filter((round) => CuratorScreening.screening(round)).length;\n    const flagged = state.rounds.filter((round) => CuratorScreening.needsReview(round)).length;\n    els.datasetNote.textContent = `${payload.name || source} · ${state.rounds.length.toLocaleString()} rounds · ${scored.toLocaleString()} scored · ${screened.toLocaleString()} screened · ${flagged.toLocaleString()} flagged · signature ${state.datasetSignature}`;''',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected curate.js source block not found:\n{old[:500]}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

          cache_path = Path("scripts/cache_images.py")
          cache = cache_path.read_text(encoding="utf-8")
          old_cache = "        pixels = list(image.getdata())"
          new_cache = '''        if hasattr(image, "get_flattened_data"):\n            pixels = list(image.get_flattened_data())\n        else:\n            pixels = list(image.getdata())'''
          if old_cache not in cache:
              raise SystemExit("Expected Pillow getdata source line not found")
          cache_path.write_text(cache.replace(old_cache, new_cache, 1), encoding="utf-8")
          PY

          node --check curate-screening.js
          node --check curate.js
          node tests/test_curate_screening.js
          python -m compileall -q scripts tests
          git diff --check

      - name: Commit integration and remove one-shot workflow
        run: |
          rm .github/workflows/apply-curator-screening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curate.js scripts/cache_images.py .github/workflows/apply-curator-screening.yml
          git commit -m "Integrate screening signals into curator"
          git push origin HEAD:build/curator-screening
