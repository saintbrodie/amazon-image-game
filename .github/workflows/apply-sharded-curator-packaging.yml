name: Apply sharded curator packaging

on:
  push:
    branches: [build/sharded-curator]
    paths:
      - ".github/workflows/apply-sharded-curator-packaging.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/sharded-curator

      - name: Add curator files to integration triggers and site artifact
        run: |
          python - <<'PY'
          from pathlib import Path

          browser = Path(".github/workflows/browser-e2e.yml")
          text = browser.read_text(encoding="utf-8")
          old = '''      - "index.html"\n      - "data/demo.json"'''
          new = '''      - "index.html"\n      - "curate.html"\n      - "curate.js"\n      - "curate-screening.js"\n      - "curate.css"\n      - "curate-quality.css"\n      - "curate-screening.css"\n      - "data/demo.json"'''
          if text.count(old) != 2:
              raise SystemExit(f"Expected browser trigger block twice, found {text.count(old)}")
          browser.write_text(text.replace(old, new), encoding="utf-8")

          deploy = Path(".github/workflows/build-deployment.yml")
          text = deploy.read_text(encoding="utf-8")
          old_trigger = '''      - "dataset-loader.js"\n      - "app.js"\n      - "index.html"'''
          new_trigger = '''      - "dataset-loader.js"\n      - "app.js"\n      - "index.html"\n      - "curate.html"\n      - "curate.js"\n      - "curate-screening.js"\n      - "curate.css"\n      - "curate-quality.css"\n      - "curate-screening.css"'''
          if old_trigger not in text:
              raise SystemExit("Expected deployment trigger block not found")
          text = text.replace(old_trigger, new_trigger, 1)

          old_copy = '          cp index.html styles.css controls.css daily.css game-core.js dataset-loader.js app.js site/'
          new_copy = '''          cp index.html styles.css controls.css daily.css game-core.js dataset-loader.js app.js \\\n            curate.html curate.js curate-screening.js curate.css curate-quality.css curate-screening.css site/'''
          if old_copy not in text:
              raise SystemExit("Expected deployment copy command not found")
          text = text.replace(old_copy, new_copy, 1)

          old_smoke = '''          curl -fsS http://127.0.0.1:8765/data/rounds.manifest.json > /tmp/manifest.json\n          shard_path=$(python - <<'PY'\n'''
          new_smoke = '''          curl -fsS http://127.0.0.1:8765/data/rounds.manifest.json > /tmp/manifest.json\n          curl -fsS http://127.0.0.1:8765/curate.html | grep -q "Round Curator"\n          shard_path=$(python - <<'PY'\n'''
          if old_smoke not in text:
              raise SystemExit("Expected deployment smoke block not found")
          text = text.replace(old_smoke, new_smoke, 1)
          deploy.write_text(text, encoding="utf-8")
          PY

          git diff --check

      - name: Commit packaging integration and remove helper
        run: |
          rm .github/workflows/apply-sharded-curator-packaging.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/browser-e2e.yml .github/workflows/build-deployment.yml .github/workflows/apply-sharded-curator-packaging.yml
          git commit -m "Include sharded curator in integration artifacts"
          git push origin HEAD:build/sharded-curator
