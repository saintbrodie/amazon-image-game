name: Build deployment artifact

on:
  workflow_dispatch:
    inputs:
      categories:
        description: "Space-separated Amazon Reviews 2023 category keys"
        required: true
        default: "All_Beauty"
        type: string
      limit:
        description: "Maximum playable rounds"
        required: true
        default: "250"
        type: string
      shard_size:
        description: "Rounds per static shard"
        required: true
        default: "75"
        type: string
      inspect_images:
        description: "Inspect cached images for metadata/privacy signals"
        required: true
        default: true
        type: boolean
      detect_faces:
        description: "Flag likely faces for human review"
        required: true
        default: true
        type: boolean
      detect_qr:
        description: "Flag QR codes for human review"
        required: true
        default: true
        type: boolean
      use_safety_model:
        description: "Run the optional transformer image safety classifier"
        required: true
        default: false
        type: boolean
      safety_model:
        description: "Hugging Face image-classification model ID"
        required: true
        default: "Falconsai/nsfw_image_detection"
        type: string
      safety_model_revision:
        description: "Optional Hugging Face model revision/commit"
        required: false
        default: ""
        type: string
      safety_positive_labels:
        description: "Space-separated classifier labels treated as review-worthy"
        required: true
        default: "nsfw"
        type: string
      safety_review_threshold:
        description: "Model score that produces a medium human-review flag"
        required: true
        default: "0.60"
        type: string
      safety_high_threshold:
        description: "Model score that produces a high-severity flag"
        required: true
        default: "0.95"
        type: string
      safety_device:
        description: "Transformers device: auto, cpu, GPU index, or backend string"
        required: true
        default: "auto"
        type: string
      exclude_high:
        description: "Exclude high-confidence privacy/problem flags"
        required: true
        default: true
        type: boolean
      curation_json:
        description: "Optional exported curator JSON. Paste the complete decisions file contents."
        required: false
        default: ""
        type: string
      only_kept:
        description: "When curation JSON is supplied, deploy only explicit keeps"
        required: true
        default: false
        type: boolean
  pull_request:
    paths:
      - ".github/workflows/build-deployment.yml"
      - "requirements-screening.txt"
      - "requirements-screening-model.txt"
      - "scripts/apply_curation.py"
      - "scripts/cache_images.py"
      - "scripts/image_safety.py"
      - "scripts/screen_dataset.py"
      - "scripts/shard_dataset.py"
      - "scripts/validate_shards.py"
      - "dataset-loader.js"
      - "app.js"
      - "index.html"
      - "curate.html"
      - "curate.js"
      - "curate-actions.js"
      - "curate-screening.js"
      - "curate.css"
      - "curate-quality.css"
      - "curate-screening.css"

concurrency:
  group: deployment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-site:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CATEGORIES: ${{ github.event_name == 'pull_request' && 'fixture' || inputs.categories }}
      ROUND_LIMIT: ${{ github.event_name == 'pull_request' && '6' || inputs.limit }}
      SHARD_SIZE: ${{ github.event_name == 'pull_request' && '2' || inputs.shard_size }}
      INSPECT_IMAGES: ${{ github.event_name == 'pull_request' && 'true' || inputs.inspect_images }}
      DETECT_FACES: ${{ github.event_name == 'pull_request' && 'true' || inputs.detect_faces }}
      DETECT_QR: ${{ github.event_name == 'pull_request' && 'true' || inputs.detect_qr }}
      USE_SAFETY_MODEL: ${{ github.event_name == 'pull_request' && 'false' || inputs.use_safety_model }}
      SAFETY_MODEL: ${{ github.event_name == 'pull_request' && 'Falconsai/nsfw_image_detection' || inputs.safety_model }}
      SAFETY_MODEL_REVISION: ${{ github.event_name == 'pull_request' && '' || inputs.safety_model_revision }}
      SAFETY_POSITIVE_LABELS: ${{ github.event_name == 'pull_request' && 'nsfw' || inputs.safety_positive_labels }}
      SAFETY_REVIEW_THRESHOLD: ${{ github.event_name == 'pull_request' && '0.60' || inputs.safety_review_threshold }}
      SAFETY_HIGH_THRESHOLD: ${{ github.event_name == 'pull_request' && '0.95' || inputs.safety_high_threshold }}
      SAFETY_DEVICE: ${{ github.event_name == 'pull_request' && 'auto' || inputs.safety_device }}
      EXCLUDE_HIGH: ${{ github.event_name == 'pull_request' && 'false' || inputs.exclude_high }}
      CURATION_JSON: ${{ github.event_name == 'pull_request' && '' || inputs.curation_json }}
      ONLY_KEPT: ${{ github.event_name == 'pull_request' && 'false' || inputs.only_kept }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image screening dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-screening.txt

      - name: Install optional model screening dependencies
        if: env.USE_SAFETY_MODEL == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements-screening-model.txt

      - name: Prepare source pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work site/data site/assets/review-cache reports
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python - <<'PY'
          import json
          import random
          from pathlib import Path
          from PIL import Image

          payload = json.loads(Path("data/demo.json").read_text(encoding="utf-8"))
          fixture_dir = Path("assets/deployment-fixture")
          fixture_dir.mkdir(parents=True, exist_ok=True)

          for index, round_data in enumerate(payload["rounds"]):
              rng = random.Random(10_000 + index)
              width, height = 192, 160
              pixels = []
              for y in range(height):
                  for x in range(width):
                      base = rng.randrange(35, 220)
                      bias = ((x * (index + 3) + y * (index + 5)) % 71) - 35
                      value = max(0, min(255, base + bias))
                      pixels.append((value, (value + 37 * index) % 256, (255 - value + 19 * index) % 256))
              image = Image.new("RGB", (width, height))
              image.putdata(pixels)
              filename = f"{round_data['id']}.png"
              image.save(fixture_dir / filename, optimize=True)
              round_data["review_image"] = f"assets/deployment-fixture/{filename}"

          Path("work/rounds.json").write_text(json.dumps(payload), encoding="utf-8")
          PY
          else
            read -r -a category_array <<< "$CATEGORIES"
            python scripts/build_pack.py \
              --categories "${category_array[@]}" \
              --limit "$ROUND_LIMIT" \
              --continue-on-error \
              --output work/rounds.json
          fi
          python scripts/validate_dataset.py work/rounds.json

      - name: Score and audit source rounds
        run: |
          set -euo pipefail
          python scripts/score_dataset.py work/rounds.json --output work/rounds.scored.json
          python scripts/validate_dataset.py work/rounds.scored.json
          python scripts/audit_dataset.py work/rounds.scored.json --json --output reports/audit-before-screening.json
          python scripts/audit_dataset.py work/rounds.scored.json > reports/audit-before-screening.txt

      - name: Cache and deduplicate review images
        run: |
          set -euo pipefail
          python scripts/cache_images.py work/rounds.scored.json \
            --output work/rounds.cached.json \
            --asset-dir site/assets/review-cache \
            --public-prefix assets/review-cache \
            --web-root . \
            --perceptual-threshold 4 \
            --workers 12
          python scripts/validate_dataset.py work/rounds.cached.json

      - name: Screen privacy and review signals
        shell: bash
        run: |
          set -euo pipefail
          args=(
            work/rounds.cached.json
            --output work/rounds.screened.json
            --report reports/screening-report.json
            --image-root site
          )
          if [[ "$INSPECT_IMAGES" == "true" ]]; then
            args+=(--inspect-images)
            if [[ "$DETECT_FACES" == "true" ]]; then args+=(--detect-faces); fi
            if [[ "$DETECT_QR" == "true" ]]; then args+=(--detect-qr); fi
          fi
          if [[ "$USE_SAFETY_MODEL" == "true" ]]; then
            if [[ "$INSPECT_IMAGES" != "true" ]]; then
              echo "use_safety_model requires inspect_images" >&2
              exit 1
            fi
            args+=(
              --safety-model "$SAFETY_MODEL"
              --safety-review-threshold "$SAFETY_REVIEW_THRESHOLD"
              --safety-high-threshold "$SAFETY_HIGH_THRESHOLD"
            )
            if [[ -n "$SAFETY_MODEL_REVISION" ]]; then
              args+=(--safety-model-revision "$SAFETY_MODEL_REVISION")
            fi
            if [[ -n "$SAFETY_DEVICE" ]]; then
              args+=(--safety-device "$SAFETY_DEVICE")
            fi
            if [[ -n "${SAFETY_POSITIVE_LABELS//[[:space:]]/}" ]]; then
              read -r -a safety_labels <<< "$SAFETY_POSITIVE_LABELS"
              for label in "${safety_labels[@]}"; do
                args+=(--safety-positive-label "$label")
              done
            fi
          fi
          if [[ "$EXCLUDE_HIGH" == "true" ]]; then args+=(--exclude-high); fi
          python scripts/screen_dataset.py "${args[@]}"
          python scripts/validate_dataset.py work/rounds.screened.json
          python scripts/audit_dataset.py work/rounds.screened.json --json --output reports/audit-after-screening.json
          python scripts/audit_dataset.py work/rounds.screened.json > reports/audit-after-screening.txt

      - name: Apply optional curator decisions
        shell: bash
        run: |
          set -euo pipefail
          cp work/rounds.screened.json work/rounds.curated.json
          apply_curation=false

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from apply_curation import dataset_signature

          dataset = json.loads(Path("work/rounds.screened.json").read_text(encoding="utf-8"))
          decisions = {
              "version": 1,
              "dataset_signature": dataset_signature(dataset["rounds"]),
              "kept_ids": [],
              "rejected_ids": [dataset["rounds"][0]["id"]],
          }
          Path("work/curation.json").write_text(json.dumps(decisions), encoding="utf-8")
          PY
            apply_curation=true
          elif [[ -n "${CURATION_JSON//[[:space:]]/}" ]]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(os.environ["CURATION_JSON"])
          if not isinstance(payload, dict):
              raise SystemExit("curation_json must decode to a JSON object")
          Path("work/curation.json").write_text(json.dumps(payload), encoding="utf-8")
          PY
            apply_curation=true
          fi

          if [[ "$apply_curation" == "true" ]]; then
            args=(
              --dataset work/rounds.screened.json
              --decisions work/curation.json
              --output work/rounds.curated.json
            )
            if [[ "$ONLY_KEPT" == "true" ]]; then args+=(--only-kept); fi
            python scripts/apply_curation.py "${args[@]}"
            python scripts/validate_dataset.py work/rounds.curated.json
            python scripts/audit_dataset.py work/rounds.curated.json --json --output reports/audit-after-curation.json
            python scripts/audit_dataset.py work/rounds.curated.json > reports/audit-after-curation.txt
            python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("work/rounds.curated.json").read_text(encoding="utf-8"))
          report = {"applied": True, **payload.get("curation", {})}
          Path("reports/curation-report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          PY
          else
            python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("work/rounds.curated.json").read_text(encoding="utf-8"))
          report = {
              "applied": False,
              "rounds_before": len(payload.get("rounds", [])),
              "rounds_after": len(payload.get("rounds", [])),
          }
          Path("reports/curation-report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          PY
          fi

      - name: Build and validate static shards
        run: |
          set -euo pipefail
          python scripts/shard_dataset.py work/rounds.curated.json \
            --manifest site/data/rounds.manifest.json \
            --shard-size "$SHARD_SIZE" \
            --shard-prefix shards/rounds
          python scripts/validate_shards.py site/data/rounds.manifest.json

      - name: Assemble static game site
        run: |
          set -euo pipefail
          cp index.html styles.css controls.css daily.css game-core.js dataset-loader.js app.js \
            curate.html curate.js curate-actions.js curate-screening.js curate.css curate-quality.css curate-screening.css site/
          cat > site/CONTENT_RIGHTS_NOTICE.txt <<'EOF'
          This artifact may contain third-party customer review media from the
          McAuley Lab Amazon Reviews 2023 dataset. Dataset availability is not
          itself a grant to republish every image. Confirm the rights and terms
          applicable to your deployment before publishing this artifact.
          EOF
          python - <<'PY'
          import json
          from pathlib import Path

          screening = json.loads(Path("reports/screening-report.json").read_text(encoding="utf-8"))
          curation = json.loads(Path("reports/curation-report.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("site/data/rounds.manifest.json").read_text(encoding="utf-8"))
          info = {
              "source": "fixture" if "${{ github.event_name }}" == "pull_request" else "McAuley Lab Amazon Reviews 2023",
              "categories_input": "${{ env.CATEGORIES }}",
              "requested_round_limit": "${{ env.ROUND_LIMIT }}",
              "shard_size": int("${{ env.SHARD_SIZE }}"),
              "rounds_deployed": manifest["round_count"],
              "dataset_signature": manifest["dataset_signature"],
              "screening": screening,
              "curation": curation,
              "github_run_id": "${{ github.run_id }}",
              "github_sha": "${{ github.sha }}",
          }
          Path("site/build-info.json").write_text(json.dumps(info, indent=2), encoding="utf-8")
          PY

      - name: Static HTTP smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory site > /tmp/amazon-image-game-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:8765/data/rounds.manifest.json > /tmp/manifest.json
          curl -fsS http://127.0.0.1:8765/curate.html | grep -q "Round Curator"
          shard_path=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/manifest.json'))['shards'][0]['path'])
          PY
          )
          curl -fsS "http://127.0.0.1:8765/data/${shard_path}" >/dev/null
          test -s site/build-info.json
          test -n "$(find site/assets/review-cache -type f -print -quit)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python - <<'PY'
          import json
          manifest = json.load(open('/tmp/manifest.json'))
          info = json.load(open('site/build-info.json'))
          assert manifest['round_count'] == 5, manifest['round_count']
          assert info['curation']['applied'] is True
          assert info['curation']['rejected_present'] == 1
          assert info['screening']['safety_model'] is None
          PY
          fi

      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Deployment pack build"
            echo
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Categories: \`${CATEGORIES}\`"
            echo "- Requested limit: \`${ROUND_LIMIT}\`"
            echo "- Shard size: \`${SHARD_SIZE}\`"
            echo "- Transformer safety model enabled: \`${USE_SAFETY_MODEL}\`"
            if [[ "$USE_SAFETY_MODEL" == "true" ]]; then
              echo "- Safety model: \`${SAFETY_MODEL}\`"
              echo "- Safety review/high thresholds: \`${SAFETY_REVIEW_THRESHOLD}\` / \`${SAFETY_HIGH_THRESHOLD}\`"
            fi
            if [[ -f reports/screening-report.json ]]; then
              echo
              echo "### Screening"
              echo '```json'
              cat reports/screening-report.json
              echo '```'
            fi
            if [[ -f reports/curation-report.json ]]; then
              echo
              echo "### Curation"
              echo '```json'
              cat reports/curation-report.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployable static site
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-image-game-site-${{ github.run_id }}
          path: site/
          retention-days: 14
          if-no-files-found: error

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-image-game-reports-${{ github.run_id }}
          path: |
            reports/
            work/rounds.json
            work/rounds.scored.json
            work/rounds.cached.json
            work/rounds.screened.json
            work/rounds.curated.json
            work/curation.json
          retention-days: 14
          if-no-files-found: warn
