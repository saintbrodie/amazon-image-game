name: Retry curator productivity patch 3

on:
  push:
    branches: [build/curator-productivity]
    paths:
      - ".github/workflows/retry3-curator-productivity.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/curator-productivity

      - name: Reuse patch script and insert productivity events by marker
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-curator-productivity.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n\n          node --check curate.js"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          code = textwrap.dedent(source[start:end])

          corrections = [
              (
                  "'''    anchor.download = `curation-${state.datasetSignature}.json`;'''",
                  "'''  anchor.download = `curation-${state.datasetSignature}.json`;'''",
              ),
              (
                  "'''    const validIds = new Set(state.rounds.map((round) => round.id));",
                  "'''  const validIds = new Set(state.rounds.map((round) => round.id));",
              ),
          ]
          for old, new in corrections:
              if old not in code:
                  raise SystemExit(f'corrective anchor not found: {old[:50]}')
              code = code.replace(old, new)

          fragile_start = code.index("replace_once(\n'''  els.signalSelect.addEventListener")
          fragile_end_marker = '"productivity events")'
          fragile_end = code.index(fragile_end_marker, fragile_start) + len(fragile_end_marker)
          code = code[:fragile_start] + code[fragile_end:]

          exec(compile(code, 'curator-productivity-patch', 'exec'))

          path = Path('curate.js')
          text = path.read_text(encoding='utf-8')
          marker = '  els.sortSelect.addEventListener("change", () => {'
          if text.count(marker) != 1:
              raise SystemExit(f'sort listener marker count was {text.count(marker)}')
          insertion = '''  els.tagSelect.addEventListener("change", () => {
            state.tag = els.tagSelect.value;
            state.index = 0;
            rebuildFilter();
          });
          els.presetSelect.addEventListener("change", () => {
            const hasSelection = Boolean(els.presetSelect.value);
            els.applyPresetButton.disabled = !hasSelection;
            els.deletePresetButton.disabled = !hasSelection;
          });
          els.applyPresetButton.addEventListener("click", applySelectedPreset);
          els.savePresetButton.addEventListener("click", saveCurrentPreset);
          els.deletePresetButton.addEventListener("click", deleteSelectedPreset);
          els.tagsInput.addEventListener("change", saveCurrentAnnotation);
          els.noteInput.addEventListener("change", saveCurrentAnnotation);
          '''
          text = text.replace(marker, insertion + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
          node --check curate.js
          git diff --check

      - name: Commit curator integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curate.js
          git commit -m "Persist curator annotations and queue presets"
          git push origin HEAD:build/curator-productivity
